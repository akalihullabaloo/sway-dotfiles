[main]
# Color de acento (cursor, magenta): lo genera ~/.config/sway/scripts/theme.sh
include=~/.config/foot/colors.ini
font=JetBrainsMono Nerd Font:size=9
pad=8x8 center

[colors-dark]
alpha=0.80

background=0d0d0d
foreground=e0e0e0

regular0=1a1a1a
regular1=f53c3c
regular2=25e712
regular3=e0a634
regular4=3391ff
regular6=33ccff
regular7=b3b3b3

bright0=4d4d4d
bright1=ff6b6b
bright2=5cff5c
bright3=ffcc66
bright4=66b3ff
bright6=66e0ff
bright7=e0e0e0

[cursor]
style=block
blink=yes

[scrollback]
lines=10000
