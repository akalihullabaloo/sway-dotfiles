# Sustituye al de Fedora (/usr/share/sway/config.d/65-mode-passthrough.conf):
# el XPS 13 no tiene tecla Pause, así que se usa Super+Shift+P.
# Modo passthrough: Sway ignora sus atajos y las teclas van directas a la
# ventana (escritorio remoto, máquinas virtuales, juegos).
mode "passthrough" {
    bindsym $mod+Shift+p mode default
}
bindsym $mod+Shift+p mode "passthrough"
