# Idle and lock configuration (override: gtklock en vez de swaylock)
#
# Mismo comportamiento que el original de Fedora, pero usando gtklock.
# Los timeouts se personalizan con $lock_timeout y $screen_timeout.

exec LT="$lock_timeout" ST="$screen_timeout" LT=${LT:-300} ST=${ST:-60} && \
    swayidle -w \
        timeout $LT 'gtklock -d' \
        timeout $((LT + ST)) 'swaymsg "output * power off"' \
                      resume 'swaymsg "output * power on"'  \
        timeout $ST 'pgrep -xu "$USER" gtklock >/dev/null && swaymsg "output * power off"' \
             resume 'pgrep -xu "$USER" gtklock >/dev/null && swaymsg "output * power on"'  \
        before-sleep 'gtklock -d' \
        lock 'gtklock -d' \
        unlock 'pkill -xu "$USER" gtklock'
