# Chuleta de atajos (Super+F1). La dibuja scripts/keybinds.py.
# Formato:
#   [Título]                    empieza una sección (icono en keybinds.py)
#   Tecla+Tecla / Otra = texto  " / " separa alternativas, "+" combina teclas
# Si cambias atajos en sway/config o tmux.conf, actualiza este archivo.

[Básicos]
Super+Enter = Terminal (foot)
Super+Shift+Enter = Terminal con pestañas y divisiones (tmux)
Super+D = Lanzador de aplicaciones (rofi)
Super+T = Gestor de archivos (Thunar)
Super+Shift+Q = Cerrar ventana (en la de pestañas pide confirmación)
Super+Shift+C = Recargar la configuración de Sway
Super+Shift+E = Salir de la sesión
Super+Shift+Esc = Bloquear pantalla
Ctrl+Alt+Supr = Menú de energía
Super+F1 = Mostrar / ocultar esta chuleta

[Notificaciones y sonido]
Super+N = Panel de notificaciones (swaync)
Super+Shift+N = No molestar
Super+Shift+M = Silenciar / activar micrófono
Vol+ / Vol- / Mute = Volumen
Brillo+ / Brillo- = Brillo de pantalla
Play / Sig / Ant = Reproductor (playerctl)
Super+M = Visualizador de audio (cava)

[Foco y ventanas]
Super+H J K L = Mover el foco (o con flechas)
Super+Shift+H J K L = Mover la ventana (o con flechas)
Super+A = Foco al contenedor padre
Super+F = Pantalla completa
Super+Shift+Espacio = Flotante / mosaico
Super+Espacio = Foco flotante / mosaico

[Espacios de trabajo]
Super+1…0 = Ir al espacio 1–10
Super+Shift+1…0 = Mover la ventana al espacio 1–10
Super+Shift+- = Enviar al scratchpad
Super+- = Mostrar / ocultar scratchpad

[Distribución]
Super+B / V = Dividir en horizontal / vertical
Super+S = Apiladas (stacking)
Super+W = En pestañas (tabbed)
Super+E = Alternar tipo de división
Super+R = Modo redimensionar
H J K L = Ajustar tamaño (o flechas; en modo redimensionar)
Enter / Esc = Salir del modo redimensionar

[Capturas]
Impr = Pantalla completa
Alt+Impr = Ventana activa
Ctrl+Impr = Área seleccionada
Super+Impr = Área y anotar (satty)

[Fondo y tema]
Super+Alt+→ / ← = Fondo siguiente / anterior
Super+Alt+R = Fondo al azar
Super+Alt+W = Selector de fondos (rofi)
Super+Alt+T = Cambiar el color de acento

[Terminal con pestañas (tmux)]
Alt+T = Pestaña nueva
Alt+1…9 = Ir a la pestaña N
Alt+RePág / AvPág = Pestaña anterior / siguiente
Alt+Shift+RePág / AvPág = Mover la pestaña
Alt+R = Renombrar pestaña
Alt+V / S = Dividir al lado / debajo
Alt+H J K L = Cambiar de panel (o con flechas)
Alt+Ctrl+H J K L = Redimensionar panel (o con flechas)
Alt+Shift+H J K L = Intercambiar panel (o con flechas)
Alt+Z = Maximizar / restaurar panel
Alt+Q = Cerrar panel o pestaña
Alt+C = Modo copia (v selecciona, y copia)

[Otros]
Super+Shift+T = Pantalla táctil (apagada al arrancar)
Super+Shift+P = Modo passthrough (Sway no intercepta teclas)
