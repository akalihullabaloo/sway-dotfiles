# tmux como "pestañas y divisiones" de foot.
# Atajos con Alt, sin prefijo (Super es de sway). El prefijo Ctrl+b sigue valiendo.
# Colores de acento: colors.conf, lo genera ~/.config/sway/scripts/theme.sh.

# --- Terminal ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB:clipboard:hyperlinks:usstyle"
set -g escape-time 10
set -g focus-events on
set -g history-limit 10000
set -g mouse on
set -g set-clipboard on
set -g set-titles on
set -g set-titles-string "󰓩  #W"   # icono de pestañas: se ve en waybar

# Numeración desde 1 (Alt+1 = primera pestaña) y sin huecos al cerrar
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Pestañas (ventanas de tmux) ---
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-q kill-pane
bind -n M-PageUp   previous-window
bind -n M-PageDown next-window
bind -n M-S-PageUp   swap-window -t -1 \; previous-window
bind -n M-S-PageDown swap-window -t +1 \; next-window
bind -n M-r command-prompt -I "#W" -p "Nombre:" "rename-window '%%'"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# --- Divisiones (paneles) ---
bind -n M-v split-window -h -c "#{pane_current_path}"   # al lado
bind -n M-s split-window -v -c "#{pane_current_path}"   # debajo
bind -n M-z resize-pane -Z                              # maximizar/restaurar
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-C-Left  resize-pane -L 3
bind -n M-C-Right resize-pane -R 3
bind -n M-C-Up    resize-pane -U 2
bind -n M-C-Down  resize-pane -D 2
bind -n M-S-Left  swap-pane -s "{left-of}"
bind -n M-S-Right swap-pane -s "{right-of}"
bind -n M-S-Up    swap-pane -s "{up-of}"
bind -n M-S-Down  swap-pane -s "{down-of}"
# Lo mismo con h/j/k/l (estilo vim)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-C-h resize-pane -L 3
bind -n M-C-j resize-pane -D 2
bind -n M-C-k resize-pane -U 2
bind -n M-C-l resize-pane -R 3
bind -n M-H swap-pane -s "{left-of}"
bind -n M-J swap-pane -s "{down-of}"
bind -n M-K swap-pane -s "{up-of}"
bind -n M-L swap-pane -s "{right-of}"

# --- Copiar (Alt+c entra; v selecciona, y copia al portapapeles) ---
setw -g mode-keys vi
bind -n M-c copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

bind R source-file ~/.config/tmux/tmux.conf \; display "tmux recargado"

# --- Aspecto: barra de pestañas arriba ---
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#0d0d0d,fg=#808080"
set -g status-left ""
set -g status-right "#{?client_prefix,#[fg=#0d0d0d#,bg=#df6124#,bold] PREFIJO ,}#[fg=#4d4d4d] #S "
set -g status-right-length 40
setw -g window-status-separator ""
setw -g window-status-format " #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#0d0d0d,bg=#df6124,bold] #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-activity-style "fg=#e0e0e0"
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

set -g pane-border-lines heavy
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#df6124"
set -g pane-border-indicators colour
set -g message-style "bg=#1a1a1a,fg=#df6124"
setw -g mode-style "bg=#df6124,fg=#0d0d0d"
set -g display-panes-active-colour "#df6124"

# Tema activo (sobrescribe el naranja de arriba)
source-file -q ~/.config/tmux/colors.conf
